name: Build the week's dashboards

# Runs the evening before each meeting, so there is time to chase a missing
# number BEFORE the room sits down rather than discovering the gap in it.
#
# Meetings are Mon/Tue/Wed/Thu. Cron here is UTC; the office is Asia/Kolkata
# (UTC+5:30), so 14:30 UTC is 20:00 IST the same evening.
#
#   Sunday  14:30 UTC -> Monday's Hiring review
#   Monday  14:30 UTC -> Tuesday's India charter
#   Tuesday 14:30 UTC -> Wednesday's US charter
#   Wednesday 14:30 UTC -> Thursday's Sloosh review
#
# It rebuilds ALL FOUR every night rather than mapping day to meeting. Renders
# are deterministic and cheap, and a day-mapping is one off-by-one away from a
# room opening an empty dashboard on a Monday morning.

on:
  schedule:
    - cron: '30 14 * * 0,1,2,3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to build (YYYY-MM-DD, any day inside it). Blank = this week.'
        required: false
        type: string

concurrency:
  group: pulse-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run every meeting
        env:
          # Set these in Settings -> Secrets and variables -> Actions.
          # None of them are ever written into the published HTML.
          GOOGLE_SA_EMAIL:        ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY:  ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          NOTION_API_KEY:         ${{ secrets.NOTION_API_KEY }}
          SLOOSH_DB_URL_REST_URL: ${{ secrets.SLOOSH_DB_URL_REST_URL }}
          SLOOSH_DB_URL_REST_KEY: ${{ secrets.SLOOSH_DB_URL_REST_KEY }}
        run: |
          node bin/pulse.js run ${{ inputs.week && format('--week {0}', inputs.week) || '' }} || true
          # `|| true` on purpose: a dead source must still publish a dashboard
          # with a flag on it. A failed build that publishes nothing is the one
          # outcome worse than a dashboard with a hole in it, because then the
          # room has neither the number nor the warning.

      - name: Build the index and package the site
        run: |
          node bin/build-index.js
          node bin/build-site.js

      - name: Commit the output
        run: |
          git config user.name  "pulse"
          git config user.email "pulse@shopos.ai"
          git add -f out/ site/ data/snapshots/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "dashboards: week of $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Say what is missing
        if: always()
        run: node bin/pulse.js check || true
